name: ci

# Started by hand only (Actions > ci > Run workflow), so a push costs nothing until you ask.
# The E2E suite is the expensive part; untick run_tests for a build-and-pack check only.
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the E2E tests
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The meta package references every other package, so building it builds all of them -
      # and nothing else. The docs site and the test project are the slow half of the solution
      # and only the tests need them.
      - name: Build packages
        run: dotnet build src/Veto/Veto.csproj -c Release

      - name: Build tests
        if: ${{ inputs.run_tests }}
        run: dotnet build tests/Veto.Tests.E2E -c Release

      - name: Install Playwright browsers
        if: ${{ inputs.run_tests }}
        run: pwsh tests/Veto.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        if: ${{ inputs.run_tests }}
        run: dotnet test tests/Veto.Tests.E2E -c Release --no-build

      # Packing on every run, not just on release, is the point: a broken .nuspec or a static
      # web asset that stopped being packed is invisible in a normal build and would otherwise
      # only be found by whoever installs the package after a release.
      - name: Pack
        run: dotnet pack Veto.slnx -c Release --no-build -o ${{ runner.temp }}/nupkgs

      - name: Verify package contents
        shell: pwsh
        run: ./tools/CheckPackageContainsStaticAssets.ps1 -PackageDirectory ${{ runner.temp }}/nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ${{ runner.temp }}/nupkgs/*