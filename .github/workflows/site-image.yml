name: site-image

# Builds the docs site (VetoWeb) into a container image and pushes it to
# ghcr.io/g-hk/veto-web. Started by hand only: Actions > site-image > Run workflow, picking the
# branch to build. Tags: latest (always the last build), the branch name and the commit sha.
# Hosting config (Traefik, compose) is kept off GitHub on purpose.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # `actor` is who caused the run, `triggering_actor` is who started this attempt.
    if: >
      github.repository == 'G-HK/Veto' &&
      github.actor == 'G-HK' &&
      github.triggering_actor == 'G-HK'

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/g-hk/veto-web
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: VetoWeb/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
